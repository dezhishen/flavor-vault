# Flavor Vault CLI 配置示例（可选）
#
# 配置文件默认在用户主目录 ~/.flavor-vault/config.yaml（fv init 生成）。
# 本示例可复制到任意位置，用 `fv -c <路径>` 指定；AI 助手（OpenClaw 等）
# 安装/调用方式各异，请始终显式 -c 指定配置，不要依赖工作目录自动查找。
# 实际上可以不写任何配置文件，直接用参数 / 环境变量：
#   读取 → fv list -c ~/.flavor-vault/config.yaml   （或 FV_ENDPOINT）
#   编辑 → fv add -c ~/.flavor-vault/config.yaml --repo owner/repo --branch recipes + GITHUB_TOKEN
#
# 两种使用模式：
#   1) 只读（查询菜谱）：只需配置 endpoint；未配置时用默认端点 https://fv.sdniu.top/data
#   2) 读写（编辑菜谱）：配置 github（菜谱仓库 + 权限）
#
# 作者信息（可选）：提交菜谱时的作者。不配置则由 GitHub token 自动获取（或 git config）
# author:
#     name: "张三"
#     email: "zhang@example.com"

endpoint: ""
# github:
#     token: ""         # GitHub 令牌（建议用环境变量 GITHUB_TOKEN）
#     repo: ""          # 菜谱数据仓库 owner/repo；留空 = 当前仓库
#     branch: recipes   # 数据分支（默认 recipes）
