# Flavor Vault CLI 配置示例（可选，recipes 数据分支）
#
# 只读：fv list/search --endpoint <url>             （或 FV_ENDPOINT）
# 编辑：fv add --repo owner/repo --branch recipes + GITHUB_TOKEN

endpoint: ""
