# Flavor Vault CLI 配置示例（可选，main 分支）
#
# 两种使用模式：
#   1) 只读（查询菜谱）：只需配置 endpoint
#   2) 读写（编辑菜谱）：配置 github（菜谱仓库 + 权限）
#
# 也可以不写本文件，直接使用参数 / 环境变量：
#   读取 → fv list --endpoint <url>             （或 FV_ENDPOINT）
#   编辑 → fv add --repo owner/repo --branch recipes + GITHUB_TOKEN

endpoint: ""
# github:
#     token: ""         # GitHub 令牌（建议用环境变量 GITHUB_TOKEN）
#     repo: ""          # 菜谱数据仓库 owner/repo；留空 = 当前仓库
#     branch: recipes   # 数据分支（默认 recipes）
