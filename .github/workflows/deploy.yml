name: Deploy to GitHub Pages & Release

on:
  push:
    # 菜谱数据分支（recipes）有变动时触发部署（仅更新 pages）
    branches: [recipes]
    # 发版：推送 v* tag（如 v1.0.0）时创建 Release 并更新 pages
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# 串行化 gh-pages 部署，避免 recipes 与 v* tag 同时触发时部署冲突
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 显式检出代码分支（main）；即便本次由 recipes 数据分支触发，代码始终来自 main
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build CLI
        run: |
          go build -o fv ./cmd/fv
          mkdir -p release && cp fv release/fv-linux-amd64

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm install --frozen-lockfile

      - name: Build Vue frontend
        run: |
          cd web
          npm run build

      # 独立菜谱数据仓库：把 recipes 分支的 config/recipes/assets 合并进工作区
      # （未使用独立分支时该分支不存在，自动跳过，使用主分支自带数据）
      - name: Checkout recipes data repo
        uses: actions/checkout@v4
        with:
          ref: recipes
          path: data-src
        continue-on-error: true

      - name: Merge data repo into workspace
        run: |
          if [ -d data-src/.flavor-vault ]; then
            mkdir -p .flavor-vault
            # 以数据仓库的 config.yaml 为准（数据侧配置权威）
            cp -f data-src/.flavor-vault/config.yaml .flavor-vault/config.yaml
            if [ -d data-src/.flavor-vault/recipes ]; then
              mkdir -p .flavor-vault/recipes
              cp -r data-src/.flavor-vault/recipes/. .flavor-vault/recipes/
            fi
            if [ -d data-src/.flavor-vault/assets ]; then
              mkdir -p .flavor-vault/assets
              cp -r data-src/.flavor-vault/assets/. .flavor-vault/assets/
            fi
            echo "已合并数据仓库（config+recipes+assets）"
          else
            echo "无 recipes 数据仓库分支，使用主分支数据"
          fi

      - name: Run ETL pipeline
        # fv build 读取 .flavor-vault/config.yaml，并将前端产物合并到 dist
        run: ./fv build --force

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      # 发版：仅在推送 v* tag 时，基于该 tag 创建 GitHub Release
      - name: Create Release (v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/fv-linux-amd64
            dist/data/ai-corpus.json
