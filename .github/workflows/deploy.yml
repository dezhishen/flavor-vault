name: Deploy to GitHub Pages & Release

on:
  push:
    # 菜谱数据分支（recipes）有变动时触发部署（仅更新 pages）
    branches: [recipes]
    # 发版：推送 v* tag（如 v1.0.0）时创建 Release 并更新 pages
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Node 20 action 弃用过渡期放行（GitHub 建议的临时方案；后续应升级到 Node 24 版 action）
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

# 串行化 gh-pages 部署，避免 recipes 与 v* tag 同时触发时部署冲突
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 显式检出代码分支（main）；即便本次由 recipes 数据分支触发，代码始终来自 main
      - uses: actions/checkout@v4
        with:
          ref: main
          # 拉取完整历史与 tags，用于基于 commit 生成 changelog
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build CLI
        run: go build -o fv ./cmd/fv

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm install --frozen-lockfile

      - name: Build Vue frontend
        run: |
          cd web
          npm run build

      # 独立菜谱数据仓库：把 recipes 分支的 recipes/assets 合并进工作区
      # （build 配置在下方 workflow 中显式声明；数据分支仅提供菜谱与图片）
      - name: Checkout recipes data repo
        uses: actions/checkout@v4
        with:
          ref: recipes
          path: data-src
        continue-on-error: true

      - name: Merge data repo into workspace
        run: |
          if [ -d data-src ]; then
            mkdir -p .flavor-vault
            # 菜谱：兼容根目录 recipes/（fv add 现用）与 .flavor-vault/recipes/（旧布局）
            if [ -d data-src/recipes ]; then
              mkdir -p .flavor-vault/recipes
              cp -r data-src/recipes/. .flavor-vault/recipes/
            fi
            if [ -d data-src/.flavor-vault/recipes ]; then
              mkdir -p .flavor-vault/recipes
              cp -r data-src/.flavor-vault/recipes/. .flavor-vault/recipes/
            fi
            # 图片资源：兼容 .flavor-vault/assets（fv add 默认）与根 assets/
            if [ -d data-src/.flavor-vault/assets ]; then
              mkdir -p .flavor-vault/assets
              cp -r data-src/.flavor-vault/assets/. .flavor-vault/assets/
            fi
            if [ -d data-src/assets ]; then
              mkdir -p .flavor-vault/assets
              cp -r data-src/assets/. .flavor-vault/assets/
            fi
            echo "已合并数据仓库（recipes+assets）"
          else
            echo "无 recipes 数据仓库分支，使用主分支数据"
          fi

      - name: Run ETL pipeline
        # build 配置在此声明（默认值 = 当前运行的 GitHub 信息，如 PAGES_BASE 由仓库推导）：
        #   --output     输出目录 ./dist
        #   --asset-dir  图片资源目录 .flavor-vault/assets
        #   --ai-snapshot 生成 ai-corpus.json
        #   --endpoint   默认数据地址 = 站点 https://fv.sdniu.top 的 data（写入 meta.json，供消费端 CLI 默认读取）
        run: |
          PAGES_BASE="https://fv.sdniu.top"
          ./fv build --force \
            --output ./dist \
            --asset-dir .flavor-vault/assets \
            --ai-snapshot \
            --endpoint "$PAGES_BASE/data"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      # ---- 发版（仅 v* tag）----
      # 预览版：tag 含 "-"（如 v1.1.0-beta.1）→ 创建 GitHub Prerelease（预览版）；
      # 稳定版：v1.1.0 → 正式 Release。

      # 多架构客户端（Windows/macOS/Linux × amd64/arm64/386，强制 CGO_ENABLED=0）
      - name: Build CLI (multi-arch, 免 cgo)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          LDFLAGS="-s -w -X flavor-vault/internal/cli.version=${VERSION#v}"
          mkdir -p release
          build() {
            os="$1"; arch="$2"; ext="$3"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" \
              -o "release/fv-${os}-${arch}${ext}" ./cmd/fv
          }
          build linux amd64 ""
          build linux arm64 ""
          build linux 386 ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 .exe
          build windows arm64 .exe
          build windows 386 .exe

      # changelog：基于 commit 信息（上一个 tag → 本 tag）
      - name: Generate changelog (基于 commit)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CUR="${{ github.ref_name }}"
          PREV=$(git tag --sort=-v:refname | awk -v c="$CUR" '$0 != c {print; exit}' || true)
          if [ -z "$PREV" ]; then
            echo "## 初始发布" > CHANGELOG.md
            git log --oneline --no-merges "$CUR" >> CHANGELOG.md
          else
            echo "## 变更（$PREV → $CUR）" > CHANGELOG.md
            git log --oneline --no-merges "$PREV..$CUR" >> CHANGELOG.md
          fi

      # 附件列表：release/* 全部；ai-corpus.json 仅在非空时附带（空文件 GitHub 拒绝上传 size<1）
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        id: rfiles
        run: |
          LIST="release/*"
          if [ -s dist/data/ai-corpus.json ]; then
            LIST=$(printf '%s\n%s' "$LIST" "dist/data/ai-corpus.json")
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$LIST" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          # 预览版：tag 含 "-"（如 v1.1.0-beta.1）标记为 prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.rfiles.outputs.files }}
